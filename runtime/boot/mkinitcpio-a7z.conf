# T5 A7Z: these storage drivers are built in; listing them makes the dependency
# explicit if a later supported configuration changes them to modules.
MODULES=(mmc_core mmc_block sunxi_mmc_host ufshcd_core ufshcd_pltfrm sunxi_ufs_platform sd_mod ext4)
BINARIES=()
FILES=()
# Never use autodetect here: cross builds see WSL/host devices, not A7Z storage.
# The base hook uses Arch's /usr/bin layout and supplies the busybox init.
HOOKS=(base udev modconf block filesystems fsck)
COMPRESSION="gzip"
COMPRESSION_OPTIONS=(-6)
MODULES_DECOMPRESS="yes"
